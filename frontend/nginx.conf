server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 圧縮を有効にし、モバイル回線での初回表示を軽くする。
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API は backend コンテナへリバースプロキシする。
    # 同一オリジンになるため、フロント側は相対パス /api で到達できる。
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ハッシュ付きのビルド成果物は長期キャッシュしてよい。
    location ~* \.(js|css|woff2?|png|jpe?g|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA のルーティング（/scan, /print/label/... 等）は index.html へフォールバック。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
